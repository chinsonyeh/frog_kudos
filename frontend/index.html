<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Frog Kudos 家庭積分獎勵系統</title>
    
    <!-- Anti-FOUC Theme Preloader -->
    <script>
      (function() {
        try {
          var t = localStorage.getItem('frog_kudos_theme') || 'emerald';
          document.documentElement.setAttribute('data-theme', t);
        } catch(e) {}
      })();
    </script>
    
    <!-- PWA Primary Color -->
    <meta name="theme-color" content="#10B981" />
    <meta name="description" content="家庭日常行為獎勵、成就記錄與願望清單兌換系統" />

    <!-- Web App Manifest -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- iOS Safari Native Web App Support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Frog Kudos" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png?v=2" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192.png?v=2" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icons/icon-512.png?v=2" />

    <!-- Favicon (幾何極簡蛙 Modern Vector) -->
    <link rel="icon" type="image/jpeg" href="/icons/gallery/icon_4_vector.jpg" />
  </head>
  <body class="bg-gray-50 text-gray-800 antialiased min-h-screen selection:bg-frog-200">
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
